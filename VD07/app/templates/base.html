<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flask Auth</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('main.index') }}">Главная</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.profile') }}">Профиль</a>
            <a href="{{ url_for('auth.logout') }}">Выйти</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Войти</a>
            <a href="{{ url_for('auth.register') }}">Регистрация</a>
        {% endif %}
    </nav>
    <hr>
    
    <!-- Блок вывода flash-сообщений об ошибках -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li style="color: red;">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}
</body>
</html>
