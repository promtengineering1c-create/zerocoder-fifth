<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Контакты</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href='{{ url_for('static', filename='css/style_task_2.css') }}' rel='stylesheet' type='text/css' >        
    </head>
    <body class="{{ body_class }}">
        <nav class="navbar navbar-light bg-light"></nav>
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main' %}active{% endif %}" href="{{ url_for('main') }}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'blog' %}active{% endif %}" href="{{ url_for('blog') }}">Блог</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'contacts' %}active{% endif %}" href="{{ url_for('contacts') }}">Контакты</a>
                </li>
            </ul>
        </nav>
        <div class="container mt-4">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
