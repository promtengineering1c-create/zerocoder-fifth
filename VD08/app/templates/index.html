<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Получить цитату</title>
    
    <!-- Подключение Bootstrap 5 через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Немного кастомного CSS для красивого фона -->
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            /* Убедимся, что фон занимает всю высоту экрана */
            min-height: 100vh; 
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Карточка с контентом -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5 text-center">
                        
                        <h1 class="mb-4 text-primary fw-bold">Генератор цитат</h1>
                        
                        <!-- Блок вывода цитаты -->
                        {% if quote %}
                            <div class="alert alert-light border shadow-sm p-4 mb-4 rounded-3" role="alert">
                                <p class="fs-4 fst-italic text-dark mb-0">«{{ quote['quote'] }}»</p>
                                
                                <!-- Если вы передаете автора с сервера, можно раскомментировать строку ниже: -->
                                <!-- <p class="text-end text-muted mt-3 mb-0 fw-semibold">— {{ author }}</p> -->
                            </div>
                        {% else %}
                            <!-- Текст-заглушка, пока цитата не загружена -->
                            <p class="text-muted mb-4 fs-5">
                                Нажмите на кнопку ниже, чтобы получить порцию вдохновения!
                            </p>
                        {% endif %}

                        <!-- Форма с кнопкой -->
                        <form method="POST">
                            <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm">
                                Получить цитату
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Подключение скриптов Bootstrap (для интерактивных элементов, если понадобятся в будущем) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
